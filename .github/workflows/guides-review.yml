name: Review Guides page
on:
  pull_request:
    paths:
      - 'src/pages/guides.astro'
      - 'src/data/guides.json'
      - 'public/guides/**'
      - 'design/guides/**'
      - 'scripts/*guides*'
      - 'scripts/render-guide-covers.mjs'
      - '.github/workflows/guides-review.yml'
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .guides-before
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir .guides-before install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm render:guide-covers
      - run: pnpm build && python3 scripts/verify-build.py
      - name: Run both local sites and capture the Guides page
        run: |
          pnpm dev --port 4321 > /tmp/guides-after.log 2>&1 &
          pnpm --dir .guides-before dev --port 4322 > /tmp/guides-before.log 2>&1 &
          for attempt in {1..40}; do
            if curl --silent --fail http://127.0.0.1:4321/guides/ > /dev/null && curl --silent --fail http://127.0.0.1:4322/guides/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/capture-guides-review.mjs before http://127.0.0.1:4322/guides/ review
          node scripts/capture-guides-review.mjs after http://127.0.0.1:4321/guides/ review
      - uses: actions/upload-artifact@v4
        with:
          name: guides-page-review
          path: review/*.png
          if-no-files-found: error
